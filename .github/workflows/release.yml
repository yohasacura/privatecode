# Builds the portable Windows release and publishes it.
#
# Triggered by a tag, so a release is a deliberate act rather than something every push does:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# What it publishes, and why it is three archives rather than one:
#
#   PrivateCode-<version>-win-x64.zip   the whole thing — what a first-time download gets
#   PrivateCode-app-<version>.zip       the app and the agent, a few MB — what an UPDATE gets
#   sidecar-<sha>.zip                   node.exe, ripgrep, tree-sitter, roslyn, sql-probe
#   latest.json                         versions and SHA-256 of each part
#
# The split exists because the heavy half is ~368 MB and almost never changes: node.exe and
# the two .NET helpers are pinned by their PROVENANCE files and move maybe twice a year, while
# the agent and the window change every day. Shipping one archive would make every bugfix a
# 380 MB download. The updater compares the hashes in latest.json and fetches only the part
# that moved.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts, but publish no release'
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release; nothing else

# Re-pushing a tag does NOT stop the run the first push started. Both go to the end, and
# whichever reaches `gh release create` first is the one that publishes; the other dies with
# "a release with the same tag name already exists".
#
# That happened on v0.1.4: a tag was moved to pick up a one-line follow-up commit, and the
# release was built from the commit BEFORE it. Harmless there — the line was a version string
# in Cargo.lock, which cargo rewrites anyway — but it is only harmless by luck. Nothing about
# the race says the older commit loses, so the published artefact was decided by which runner
# was quicker, and the visible symptom was a red step on the run that had the right code.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # The action majors below are each that action's LATEST, and they differ from one another
    # because the projects number independently — not because one is being held back. They
    # were bumped together off a deprecation notice: v4 of all four ran on Node 20, which
    # GitHub now force-runs on Node 24 and will eventually stop running at all.
    #
    # What was checked before jumping, since these are three majors in one move:
    #   setup-node v5 turns caching on BY ITSELF when package.json has a `packageManager`
    #     field. Neither of ours does, so nothing changes; if one ever gains it, this step
    #     starts caching silently and `package-manager-cache: false` is the off switch.
    #   setup-dotnet v5 and upload-artifact v6 require an Actions runner of 2.327.1 or newer.
    #     `windows-latest` is GitHub-hosted and far past that; a SELF-hosted runner would not
    #     be, which is the one way this bump can bite later.
    #   upload-artifact v7 adds an optional `archive` input and changes nothing about `name`,
    #     `path` or `retention-days`, which is all this workflow passes.
    #   checkout v5 through v7 carry nothing that touches a plain checkout with no inputs.
    #
    # Verified by a `workflow_dispatch` dry run before the next tag, rather than discovered
    # during one: a release is the worst moment to learn that the pipeline moved.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The two vendored helpers are `dotnet publish`ed from tools/ — see their PROVENANCE.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@stable

      # Rust dominates the build; without this every run recompiles the whole dependency tree.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Before anything is built, because a release whose version does not match its tag is
      # published, correct, downloadable -- and invisible to the updater, which compares the
      # manifest's version with the running app's own. Nothing would look broken.
      - name: Check the version matches the tag
        run: node scripts/check-version.mjs ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Install dependencies
        run: |
          npm ci --prefix core
          npm ci --prefix app

      # Downloads node.exe and rg.exe and verifies the publisher's own SHA-256 for both the
      # archive and the extracted file, copies the tree-sitter wasm out of node_modules where
      # npm has already checked their integrity, and builds the two .NET helpers from source.
      - name: Stage vendor/
        run: node scripts/fetch-vendor.mjs

      # AFTER vendor/ is staged, because the suites use it: `search_code` runs the vendored
      # ripgrep and `symbol_outline` loads the vendored wasm, and with the binaries no longer
      # committed they do not exist until the step above has run. Putting the tests first --
      # which is where they naturally want to go -- failed 11 files with
      # "ripgrep is unavailable", and that was my own doing, not a bug in the code under test.
      #
      # One command per step, deliberately. A multi-line `run:` on a Windows runner is
      # PowerShell, and PowerShell reports only the LAST command's exit code -- so these four
      # as one block passed while `npm test --prefix core` was failing 60 tests, and the gate
      # that exists to stop a bad release was decorative. Caught because the publish step
      # failed for an unrelated reason and the log had to be read.
      - name: Typecheck core
        run: npm run typecheck --prefix core
      - name: Typecheck app
        run: npm run typecheck --prefix app
      - name: Test core
        run: npm test --prefix core
      - name: Test app
        run: npm test --prefix app

      - name: Bundle the agent sidecar
        run: npm run bundle --prefix core

      - name: Build the app
        run: npm run tauri build --prefix app -- --no-bundle
        # --no-bundle: we want the raw executable and its resources, not an installer. Tauri
        # has no "portable" bundle target, and the owner never installs anything.

      # The shell has unit tests too, and until this step existed nothing ran them -- which is
      # how a backwards version comparison shipped: `available` was `manifest != current`, so
      # a build NEWER than the latest release offered to move itself back to it.
      #
      # Here rather than beside the other test steps, for two reasons. It cannot run before
      # `Bundle the agent sidecar`: tauri's build script resolves `bundle.resources`, and with
      # `core/dist/sidecar` not yet built it fails with "resource path doesn't exist" -- which
      # is exactly what putting it up there did. And `--release` after `Build the app` reuses
      # that build's dependency tree instead of compiling the whole of tauri again in debug.
      # It still gates Package and Publish, which is the only thing a gate has to do.
      - name: Test the shell
        run: cargo test --release --manifest-path app/src-tauri/Cargo.toml

      - name: Package
        id: package
        shell: pwsh
        run: node scripts/package-release.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: privatecode-${{ steps.package.outputs.version }}
          path: release/
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # -Path explicitly, as an array. Get-ChildItem's second POSITIONAL argument is
          # -Filter, not another path, so `Get-ChildItem release/*.zip release/latest.json`
          # went looking for a path inside release/ named after release/ itself, and the
          # publish failed after a nine-minute build with everything already packaged.
          $assets = Get-ChildItem -Path release/*.zip, release/latest.json | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets --title "${{ github.ref_name }}" --notes-file release/NOTES.md
